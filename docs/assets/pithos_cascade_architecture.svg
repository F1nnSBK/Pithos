<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .node-rect { fill: #1e293b; stroke: #475569; stroke-width: 1.5; rx: 6px; }
      .node-active { fill: #1e293b; stroke: #6366f1; stroke-width: 1.8; rx: 6px; }
      .sidecar-rect { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 4px; }
      
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; font-size: 15px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      
      .header-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; font-size: 13.5px; font-weight: 600; fill: #f1f5f9; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; font-size: 11.5px; fill: #94a3b8; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace; font-size: 11px; font-weight: 600; fill: #38bdf8; text-anchor: end; }
      .accent-badge { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace; font-size: 11px; font-weight: 600; fill: #34d399; text-anchor: end; }
      
      .sidecar-title { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace; font-size: 11px; font-weight: 600; fill: #e2e8f0; }
      .sidecar-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; font-size: 10.5px; fill: #64748b; }
      .sidecar-metric { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace; font-size: 10.5px; font-weight: 600; fill: #38bdf8; text-anchor: end; }
      
      .conn-line { stroke: #64748b; stroke-width: 1.5; stroke-linecap: round; }
      .conn-accent { stroke: #6366f1; stroke-width: 1.5; stroke-dasharray: 4, 4; stroke-linecap: round; }
      .conn-arrow { fill: #64748b; }
      .conn-arrow-accent { fill: #6366f1; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="conn-arrow"/>
    </marker>
    <marker id="arrow-acc" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="conn-arrow-accent"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="880" height="620" class="bg" rx="8"/>

  <!-- Main Document Header -->
  <text x="440" y="32" class="title-text">PITHOS 5-LEVER CASCADE ARCHITECTURE</text>
  <text x="440" y="50" class="subtitle-text">Multi-Stage Model-Isomorphic Vector Retrieval &amp; Distance Computation</text>

  <!-- 1. Input Node -->
  <g transform="translate(100, 70)">
    <rect width="600" height="42" class="node-rect"/>
    <text x="20" y="26" class="header-text">Query Vector q (Continuous FP32 Precision)</text>
    <text x="580" y="26" class="badge-text">100% Precision</text>
  </g>

  <!-- Flow Arrow: Input -> Gate 1 -->
  <line x1="400" y1="112" x2="400" y2="138" class="conn-line" marker-end="url(#arrow)"/>

  <!-- Bypass Line: FP32 to Gate 3 -->
  <path d="M 700 91 L 790 91 L 790 410 L 760 410" class="conn-accent" marker-end="url(#arrow-acc)"/>
  <text x="800" y="250" class="desc-text" transform="rotate(90 800 250)" style="font-size: 10px; fill: #818cf8;">FP32 Query Stream</text>

  <!-- 2. Gate 1 Node -->
  <g transform="translate(100, 140)">
    <rect width="600" height="60" class="node-rect"/>
    <text x="20" y="24" class="header-text">Gate 1: Geodetic Spatial &amp; Saliency Filtering</text>
    <text x="580" y="24" class="accent-badge">0 Clock Cycles</text>
    <text x="20" y="44" class="desc-text">48-Bit Morton Code in Metadata Word m_i • Instant Bounding Box Pruning</text>
  </g>

  <!-- Flow Arrow: Gate 1 -> Gate 2 -->
  <line x1="400" y1="200" x2="400" y2="228" class="conn-line" marker-end="url(#arrow)"/>

  <!-- 3. Gate 2 Node -->
  <g transform="translate(100, 230)">
    <rect width="600" height="72" class="node-rect"/>
    <text x="20" y="24" class="header-text">Gate 2: Matryoshka QJL-Residual Scan &amp; Resonant Voting</text>
    <text x="580" y="24" class="accent-badge">&gt; 96.0% Recall</text>
    <text x="20" y="44" class="desc-text">Bitwise XOR-Popcount Cascade (AVX-512 VPOPCNTDQ / ARM Neon)</text>
    <text x="20" y="60" class="desc-text">Hierarchical Spherical Pruning via Centroid Triangle Inequality</text>
  </g>

  <!-- Flow Arrow: Gate 2 -> Gate 3 -->
  <line x1="400" y1="302" x2="400" y2="330" class="conn-line" marker-end="url(#arrow)"/>

  <!-- 4. Gate 3 Node (Sidecar Reranking) -->
  <g transform="translate(100, 332)">
    <rect width="650" height="155" class="node-active"/>
    <text x="20" y="25" class="header-text">Gate 3: Exact Reranking via Asymmetric Query LUTs (Hebel 1)</text>
    <text x="630" y="25" class="accent-badge">Zero-FP Multiply</text>
    <text x="20" y="43" class="desc-text">Precomputed Query LUTs decode compressed sidecars in L1 Cache</text>

    <!-- Sidecar Option 1: FP8 -->
    <g transform="translate(15, 55)">
      <rect width="195" height="85" class="sidecar-rect"/>
      <text x="12" y="20" class="sidecar-title">FP8 (E4M3)</text>
      <text x="183" y="20" class="accent-badge">1.0 B/dim</text>
      <text x="12" y="42" class="sidecar-sub">1.19 TB (2.72B Index)</text>
      <text x="12" y="58" class="sidecar-sub">100.0% Recall@1</text>
      <text x="12" y="74" class="sidecar-sub" style="fill: #34d399;">Recommended</text>
    </g>

    <!-- Sidecar Option 2: NVFP4 -->
    <g transform="translate(225, 55)">
      <rect width="195" height="85" class="sidecar-rect"/>
      <text x="12" y="20" class="sidecar-title">NVFP4 (E2M1)</text>
      <text x="183" y="20" class="sidecar-metric">0.56 B/dim</text>
      <text x="12" y="42" class="sidecar-sub">668 GB (2.72B Index)</text>
      <text x="12" y="58" class="sidecar-sub">96.8% Recall@1</text>
      <text x="12" y="74" class="sidecar-sub">32,000 vectors/s (4x)</text>
    </g>

    <!-- Sidecar Option 3: FP16 -->
    <g transform="translate(435, 55)">
      <rect width="195" height="85" class="sidecar-rect"/>
      <text x="12" y="20" class="sidecar-title">FP16 (IEEE 754)</text>
      <text x="183" y="20" class="sidecar-metric">2.0 B/dim</text>
      <text x="12" y="42" class="sidecar-sub">2.23 TB (2.72B Index)</text>
      <text x="12" y="58" class="sidecar-sub">100.0% Recall@1</text>
      <text x="12" y="74" class="sidecar-sub">Baseline Precision</text>
    </g>
  </g>

  <!-- Flow Arrow: Gate 3 -> Output -->
  <line x1="425" y1="487" x2="425" y2="520" class="conn-line" marker-end="url(#arrow)"/>

  <!-- 5. Output Result Node -->
  <g transform="translate(200, 522)">
    <rect width="450" height="42" class="node-rect"/>
    <text x="225" y="26" class="header-text" text-anchor="middle">Exact KNN Top-K Search Results</text>
  </g>
</svg>
