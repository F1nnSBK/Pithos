<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .box { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 4; }
      .box-highlight { fill: #0f2b38; stroke: #0284c7; stroke-width: 1.5; rx: 4; }
      .box-meta { fill: #1e1e38; stroke: #6366f1; stroke-width: 1.5; rx: 4; }
      .box-footer { fill: #2a1b3d; stroke: #a855f7; stroke-width: 1.5; rx: 4; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 14px; font-weight: 600; fill: #f8fafc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 11px; fill: #94a3b8; }
      .tag { font-family: monospace; font-size: 10px; fill: #38bdf8; }
      .tag-purple { font-family: monospace; font-size: 10px; fill: #c084fc; }
      .tag-indigo { font-family: monospace; font-size: 10px; fill: #818cf8; }
      .line { stroke: #475569; stroke-width: 1; stroke-dasharray: 4,4; }
      .arrow { stroke: #0284c7; stroke-width: 1.5; fill: none; }
      .label-right { font-family: monospace; font-size: 10px; fill: #64748b; text-anchor: end; }
      .label-left { font-family: monospace; font-size: 10px; fill: #64748b; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" class="bg" />

  <!-- Container Outline -->
  <rect x="40" y="30" width="880" height="420" fill="none" stroke="#1e293b" stroke-width="2" rx="8" />

  <!-- Header Section -->
  <text x="50" y="20" class="title" fill="#cbd5e1">PITHOS UNIVERSAL SINGLE-FILE CONTAINER (.pithos) — BINARY MEMORY LAYOUT</text>

  <!-- Superblock -->
  <rect x="60" y="50" width="840" height="50" class="box-highlight" />
  <text x="80" y="72" class="title">SUPERBLOCK (128 Bytes)</text>
  <text x="80" y="88" class="subtitle">Magic: "DIOGENES" (8B) | Version 2 (4B) | Vectors N (8B) | Dim D (4B) | Metric (2B) | Sidecar (2B) | Tiers (16B) | TOC Offset &amp; Len (12B)</text>
  <text x="880" y="80" class="label-right">Offset 0x0000</text>

  <!-- Section 1: IDs -->
  <rect x="60" y="110" width="840" height="44" class="box" />
  <text x="80" y="130" class="title">SECTION 1: ITEM IDENTIFIERS</text>
  <text x="80" y="145" class="subtitle">Contiguous 64-bit unsigned integers: uint64_t ids[N] (64-Byte Cache-Line Aligned)</text>
  <text x="880" y="138" class="label-right">align64(128)</text>

  <!-- Section 2: Quantization Tiers -->
  <rect x="60" y="164" width="840" height="60" class="box" />
  <text x="80" y="186" class="title">SECTION 2: MATRYOSHKA QUANTIZATION TIERS (Bit-Packed Columns)</text>
  <text x="80" y="202" class="subtitle">Tier 0 (W0 dims, 1-bit / 2-bit QJL) | Tier 1 (W1 dims) | ... | Tier K-1 (WK-1 dims)</text>
  <text x="80" y="216" class="tag">SIMD Hamming Early-Exit Scan Target (AVX-512 / ARM Neon VPOPCNTDQ)</text>
  <text x="880" y="200" class="label-right">Aligned 64B</text>

  <!-- Section 3: Precision Sidecar -->
  <rect x="60" y="234" width="840" height="52" class="box" />
  <text x="80" y="256" class="title">SECTION 3: PRECISION SIDECAR (FP8 E4M3 / Blackwell NVFP4 / FP16 / FP32)</text>
  <text x="80" y="272" class="subtitle">Continuous precision storage for Gate 3 exact in-engine reranking: N x D elements or Block Microscales</text>
  <text x="880" y="265" class="label-right">Aligned 64B</text>

  <!-- Section 4: Schema-Agnostic Metadata Payload -->
  <rect x="60" y="296" width="840" height="52" class="box-meta" />
  <text x="80" y="318" class="title">SECTION 4: SCHEMA-AGNOSTIC METADATA PAYLOAD</text>
  <text x="80" y="334" class="subtitle">Arbitrary user payload: Embedded JSONL lines / Apache Arrow IPC stream / SQLite / Binary attributes</text>
  <text x="880" y="327" class="label-right">Aligned 64B</text>

  <!-- Section 5: Table of Contents (JSON) -->
  <rect x="60" y="358" width="840" height="42" class="box-footer" />
  <text x="80" y="378" class="title">TABLE OF CONTENTS (TOC JSON Directory)</text>
  <text x="80" y="392" class="subtitle">Self-describing JSON directory with section byte offsets, lengths, formats, and user_metadata dictionary</text>
  <text x="880" y="385" class="label-right">toc_offset</text>

  <!-- Section 6: Trailer -->
  <rect x="60" y="410" width="840" height="34" class="box-highlight" />
  <text x="80" y="432" class="title">TRAILER (20 Bytes at EOF)</text>
  <text x="320" y="432" class="subtitle">toc_offset (uint64_t, 8B) | toc_length (uint32_t, 4B) | Magic: "PITHOSDB" (8B)</text>
  <text x="880" y="432" class="label-right">EOF - 20B</text>

</svg>
