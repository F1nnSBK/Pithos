name: Build and Release Native Binaries

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: pithos.so
            output_name: libpithos-linux-x86_64.so
          - os: ubuntu-24.04-arm
            artifact_name: pithos.so
            output_name: libpithos-linux-aarch64.so
          - os: macos-latest
            artifact_name: pithos.dylib
            output_name: libpithos-macos-aarch64.dylib

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Java Unit Tests
        run: mvn test

      - name: Compile Native Shared Library
        run: mvn clean package -DskipTests

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies & Test Suite
        run: |
          mkdir -p src/pithos/lib
          cp target/${{ matrix.artifact_name }} src/pithos/lib/${{ matrix.output_name }}
          cp target/${{ matrix.artifact_name }} src/pithos/lib/libpithos.${{ matrix.os == 'macos-latest' && 'dylib' || 'so' }}
          python -m pip install --upgrade pip
          python -m pip install numpy build wheel pyarrow
          python -m pip install -e .

      - name: Run End-to-End Python Test Suite
        run: |
          python tests/test_pithos_complete.py
          python tests/test_fpga_co_design.py
          python tests/test_pithos_fp8_sidecar.py
          python tests/test_pithos_container.py
          python tests/test_isolate_lifecycle.py
          python tests/test_real_model_recall.py

      - name: Run Verification Benchmarks
        run: |
          python benchmarks/verify_wal.py
          python benchmarks/verify_compaction.py
          python benchmarks/verify_lsm.py
          python benchmarks/verify_optional_fp16.py
          python benchmarks/verify_fp8_sidecar.py
          python benchmarks/verify_real_model_recall.py
          python benchmarks/verify_efficiency_gains.py

      - name: Build Platform-Specific Python Wheel
        run: |
          mkdir -p src/pithos/lib
          cp target/${{ matrix.artifact_name }} src/pithos/lib/${{ matrix.output_name }}
          cp target/${{ matrix.artifact_name }} src/pithos/lib/libpithos.${{ matrix.os == 'macos-latest' && 'dylib' || 'so' }}
          python -m build --wheel --outdir build-binaries/


      - name: Prepare Artifacts and C/C++ SDK
        run: |
          mkdir -p build-binaries
          cp target/${{ matrix.artifact_name }} build-binaries/${{ matrix.output_name }}
          cp include/pithos.h build-binaries/
          cp target/graal_isolate.h build-binaries/
          
          # Create C/C++ SDK bundle
          mkdir -p build-binaries/sdk/include build-binaries/sdk/lib build-binaries/sdk/cmake build-binaries/sdk/examples
          cp include/pithos.h build-binaries/sdk/include/
          cp target/graal_isolate.h build-binaries/sdk/include/
          cp target/${{ matrix.artifact_name }} build-binaries/sdk/lib/
          cp cmake/PithosConfig.cmake build-binaries/sdk/cmake/
          cp cmake/pithos.pc.in build-binaries/sdk/cmake/
          cp examples/cpp/*.c build-binaries/sdk/examples/
          tar -czvf build-binaries/pithos-c-sdk-${{ matrix.os }}.tar.gz -C build-binaries/sdk .
          rm -rf build-binaries/sdk

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pithos-binaries-${{ matrix.os }}
          path: build-binaries/


  build-cuda:
    name: Build CUDA Shared Library (Docker) - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build CUDA Library in Docker
        run: |
          docker build -f Dockerfile.cuda --target builder -t pithos-cuda-builder .

      - name: Extract Binaries from Docker
        run: |
          mkdir -p build-binaries
          docker create --name extractor pithos-cuda-builder
          docker cp extractor:/build/target/pithos.so build-binaries/libpithos-linux-cuda-${{ matrix.arch }}.so
          docker cp extractor:/build/target/pithos.h build-binaries/
          docker cp extractor:/build/target/graal_isolate.h build-binaries/
          docker rm extractor

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pithos-binaries-cuda-${{ matrix.arch }}
          path: build-binaries/

  release:
    name: Publish GitHub Release
    needs: [build, build-cuda]
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-binaries

      - name: Flatten folder structure for release
        run: |
          mkdir -p release-assets
          find all-binaries -type f -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          RELEASE_TITLE: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest Automated Build' }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
        run: |
          set -e
          echo "Publishing release binaries for tag: ${TAG_NAME}"
          
          if [ "$IS_TAG" = "false" ]; then
            gh release delete latest --yes || true
            git push --delete origin latest || true
            git tag -f latest
            git push origin latest --force
            gh release create latest release-assets/* --title "${RELEASE_TITLE}" --notes "Automated rolling build from main branch." --prerelease
          else
            if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
              gh release upload "${TAG_NAME}" release-assets/* --clobber
            else
              gh release create "${TAG_NAME}" release-assets/* --title "${RELEASE_TITLE}" --notes "Release ${RELEASE_TITLE} with Universal Single-File Container (.pithos) format, Blackwell FP8 / NVFP4 sidecars, and Apache Arrow IPC integration."
            fi
          fi